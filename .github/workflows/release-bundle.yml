name: XDR Plugin Bundle Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xdr-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OPENSEARCH_DASHBOARDS_REPOSITORY: opensearch-project/OpenSearch-Dashboards
  XDR_COORDINATOR_REPOSITORY: ${{ github.repository_owner }}/xdr-coordinator
  XDR_DEFENSE_REPOSITORY: ${{ github.repository_owner }}/xdr-defense
  XDR_VISUALIZER_REPOSITORY: ${{ github.repository_owner }}/xdr-visualizer
  XDR_NAVIGATOR_REPOSITORY: ${{ github.repository_owner }}/xdr-navigator

jobs:
  metadata:
    name: Compute release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sources: ${{ steps.meta.outputs.sources }}
      catalog_tag: ${{ steps.meta.outputs.catalog_tag }}
    steps:
      - name: Compute release metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.XDR_SOURCE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          TAG="xdr-plugins-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          SOURCES='{}'
          for plugin in xdr-coordinator xdr-defense xdr-visualizer xdr-navigator; do
            REPO="${GITHUB_REPOSITORY_OWNER}/${plugin}"
            BRANCH=$(gh api "repos/${REPO}" --jq .default_branch)
            SHA=$(gh api "repos/${REPO}/commits/${BRANCH}" --jq .sha)
            SOURCES=$(jq -c --arg plugin "$plugin" --arg sha "$SHA" '. + {($plugin): $sha}' <<< "$SOURCES")
          done
          echo "sources=${SOURCES}" >> "$GITHUB_OUTPUT"
          CATALOG_TAG=$(gh api "repos/${GITHUB_REPOSITORY_OWNER}/xdr-agent/releases/latest" --jq .tag_name)
          echo "catalog_tag=${CATALOG_TAG}" >> "$GITHUB_OUTPUT"

  build-plugin:
    name: Build ${{ matrix.plugin }} ZIP
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        osd_version: [3.5.0, 3.6.0, 3.7.0, 3.8.0, 3.9.0]
        plugin: [xdr-security, xdr-coordinator, xdr-defense, xdr-visualizer, xdr-navigator]

    permissions:
      contents: read

    steps:
      - name: Checkout xdr-security
        uses: actions/checkout@v4
        with:
          path: sources/xdr-security
          ref: ${{ github.sha }}

      - name: Checkout external plugin repo
        if: matrix.plugin != 'xdr-security'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.plugin }}
          ref: ${{ fromJSON(needs.metadata.outputs.sources)[matrix.plugin] }}
          token: ${{ secrets.XDR_SOURCE_TOKEN || github.token }}
          path: sources/${{ matrix.plugin }}

      - name: Checkout OpenSearch Dashboards
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OPENSEARCH_DASHBOARDS_REPOSITORY }}
          ref: ${{ matrix.osd_version }}
          path: opensearch-dashboards

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: opensearch-dashboards/.nvmrc
          registry-url: https://registry.npmjs.org

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Cache yarn packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-osd-${{ hashFiles('opensearch-dashboards/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-osd-

      - name: Bootstrap OpenSearch Dashboards
        working-directory: opensearch-dashboards
        run: yarn osd bootstrap --single-version=loose || yarn osd bootstrap --single-version=loose

      - name: Fetch matching installed-rule catalog
        if: matrix.plugin == 'xdr-defense'
        env:
          GH_TOKEN: ${{ secrets.XDR_SOURCE_TOKEN || github.token }}
          CATALOG_TAG: ${{ needs.metadata.outputs.catalog_tag }}
        run: |
          gh release download "$CATALOG_TAG" --repo "${GITHUB_REPOSITORY_OWNER}/xdr-agent" \
            --pattern catalog.json --dir rule-catalog
          cp rule-catalog/catalog.json sources/xdr-defense/server/data/yara-core-linux.json

      - name: Test component contracts
        if: matrix.plugin == 'xdr-security' || matrix.plugin == 'xdr-defense' || matrix.plugin == 'xdr-coordinator' || matrix.plugin == 'xdr-navigator'
        env:
          OSD_ROOT: ${{ github.workspace }}/opensearch-dashboards
        run: |
          NODE_PATH="${OSD_ROOT}/node_modules" node --test sources/${{ matrix.plugin }}/scripts/test_*.cjs

      - name: Resolve plugin source path
        id: src
        run: |
          if [ "${{ matrix.plugin }}" = "xdr-security" ]; then
            echo "path=${GITHUB_WORKSPACE}/sources/xdr-security" >> "$GITHUB_OUTPUT"
          else
            echo "path=${GITHUB_WORKSPACE}/sources/${{ matrix.plugin }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage plugin source
        run: |
          set -euo pipefail
          mkdir -p "opensearch-dashboards/plugins/${{ matrix.plugin }}"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='build' \
            --exclude='node_modules' \
            --exclude='.yarn' \
            --exclude='.pnp.*' \
            --exclude='opensearch-dashboards' \
            --exclude='sources' \
            "${{ steps.src.outputs.path }}/" "opensearch-dashboards/plugins/${{ matrix.plugin }}/"

      - name: Verify plugin version metadata
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p "require('${{ steps.src.outputs.path }}/package.json').version")
          MANIFEST_VERSION=$(node -p "require('${{ steps.src.outputs.path }}/opensearch_dashboards.json').version")

          if [ "${PACKAGE_VERSION}" != "${MANIFEST_VERSION}" ]; then
            echo "Version mismatch in ${{ matrix.plugin }}: package.json=${PACKAGE_VERSION}, opensearch_dashboards.json=${MANIFEST_VERSION}" >&2
            exit 1
          fi

      - name: Build plugin ZIP
        working-directory: opensearch-dashboards/plugins/${{ matrix.plugin }}
        run: node ../../scripts/plugin_helpers build --opensearch-dashboards-version=${{ matrix.osd_version }}

      - name: Collect plugin artifact
        run: |
          set -euo pipefail
          mkdir -p out/plugins out/meta

          ZIP_PATH=$(find "opensearch-dashboards/plugins/${{ matrix.plugin }}/build" -maxdepth 1 -name '*.zip' | head -1)
          if [ -z "${ZIP_PATH}" ]; then
            echo "Built ZIP not found for ${{ matrix.plugin }}" >&2
            exit 1
          fi

          cp "${ZIP_PATH}" "out/plugins/${{ matrix.plugin }}.zip"

          PACKAGE_VERSION=$(node -p "require('${{ steps.src.outputs.path }}/package.json').version")
          PLUGIN_ID=$(node -p "require('${{ steps.src.outputs.path }}/opensearch_dashboards.json').id")

          cat > "out/meta/${{ matrix.plugin }}.json" <<EOF
          {
            "repo": "${{ matrix.plugin }}",
            "pluginId": "${PLUGIN_ID}",
            "version": "${PACKAGE_VERSION}",
            "osdVersion": "${{ matrix.osd_version }}",
            "sourceCommit": "$(git -C "${{ steps.src.outputs.path }}" rev-parse HEAD)",
            "dashboardsCommit": "$(git -C opensearch-dashboards rev-parse HEAD)",
            "ruleCatalogRelease": "${{ needs.metadata.outputs.catalog_tag }}"
          }
          EOF

      - name: Upload plugin artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.plugin }}-osd-${{ matrix.osd_version }}
          path: out/
          retention-days: 2

  bundle-assets:
    name: Bundle release artifacts
    needs: [metadata, build-plugin]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        osd_version: [3.5.0, 3.6.0, 3.7.0, 3.8.0, 3.9.0]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Download all plugin artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: plugin-*-osd-${{ matrix.osd_version }}
          path: release-artifacts/raw
          merge-multiple: true

      - name: Assemble release-artifacts directories
        run: |
          set -euo pipefail
          mkdir -p release-artifacts/plugins release-artifacts/meta
          cp release-artifacts/raw/plugins/*.zip release-artifacts/plugins/
          cp release-artifacts/raw/meta/*.json release-artifacts/meta/

      - name: Build manifest JSON
        run: |
          set -euo pipefail
          jq -s \
            --arg osd "${{ matrix.osd_version }}" \
            --arg tag "${{ needs.metadata.outputs.tag }}" \
            '{releaseTag: $tag, opensearchDashboardsVersion: $osd, plugins: .}' \
            release-artifacts/meta/*.json > "release-artifacts/xdr-plugins_${{ needs.metadata.outputs.tag }}_osd-${{ matrix.osd_version }}_manifest.json"

      - name: Generate checksums
        run: |
          set -euo pipefail
          (
            cd release-artifacts/plugins
            sha256sum *.zip > "../xdr-plugins_${{ needs.metadata.outputs.tag }}_osd-${{ matrix.osd_version }}.sha256"
          )

      - name: Create plugin bundle tarball
        run: |
          set -euo pipefail
          tar -czf "release-artifacts/xdr-plugins_${{ needs.metadata.outputs.tag }}_osd-${{ matrix.osd_version }}.tar.gz" -C release-artifacts/plugins .

      - name: Generate compose override asset
        run: |
          set -euo pipefail
          cat > "release-artifacts/docker-compose.xdr-plugins.${{ needs.metadata.outputs.tag }}.osd-${{ matrix.osd_version }}.yml" <<EOF
          services:
            opensearch-dashboards:
              image: ghcr.io/${{ github.repository_owner }}/opensearch-dashboards-xdr-bundle:${{ needs.metadata.outputs.tag }}-osd-${{ matrix.osd_version }}
              ports:
                - "5601:5601"
              environment:
                OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
          EOF

      - name: Upload release assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-assets-osd-${{ matrix.osd_version }}
          path: release-artifacts/
          retention-days: 2

  smoke-test:
    name: Verify five plugin ZIPs for OSD ${{ matrix.osd_version }}
    needs: [metadata, build-plugin]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        osd_version: [3.5.0, 3.6.0, 3.7.0, 3.8.0, 3.9.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-*-osd-${{ matrix.osd_version }}
          path: plugins-input
          merge-multiple: true
      - name: Verify complete bundle and ZIP metadata
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/verify_bundle.py plugins-input ${{ matrix.osd_version }}

  docker-image:
    name: Build and publish bundle image
    needs: [metadata, build-plugin, smoke-test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        osd_version: [3.5.0, 3.6.0, 3.7.0, 3.8.0, 3.9.0]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - name: Download all plugin artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: plugin-*-osd-${{ matrix.osd_version }}
          path: docker-input
          merge-multiple: true

      - name: Create Docker build context
        run: |
          set -euo pipefail
          mkdir -p docker-context/plugins
          cp docker-input/plugins/*.zip docker-context/plugins/

          cp deploy/Dockerfile docker-context/Dockerfile

      - name: Build test image
        run: docker build --build-arg OSD_VERSION=${{ matrix.osd_version }} -t xdr-bundle:test docker-context

      - name: Verify authenticated bundle startup
        run: |
          sudo sysctl -w vm.max_map_count=262144
          bash scripts/smoke_bundle.sh xdr-bundle:test ${{ matrix.osd_version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform bundle image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            OSD_VERSION=${{ matrix.osd_version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/opensearch-dashboards-xdr-bundle:${{ needs.metadata.outputs.tag }}-osd-${{ matrix.osd_version }}
            ghcr.io/${{ github.repository_owner }}/opensearch-dashboards-xdr-bundle:latest-osd-${{ matrix.osd_version }}

  docker-plugin-sidecar:
    name: Build and publish plugin-only sidecar image
    if: github.event_name != 'pull_request'
    needs: [metadata, build-plugin, smoke-test, docker-image]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        osd_version: [3.5.0, 3.6.0, 3.7.0, 3.8.0, 3.9.0]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - name: Download all plugin artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: plugin-*-osd-${{ matrix.osd_version }}
          path: sidecar-input
          merge-multiple: true

      - name: Create plugin sidecar build context
        run: |
          set -euo pipefail
          mkdir -p sidecar-context/plugins
          cp sidecar-input/plugins/*.zip sidecar-context/plugins/

          cat > sidecar-context/Dockerfile <<'EOF'
          FROM alpine:latest

          # ZIP transport only; install these archives with the Dashboards plugin CLI.
          # Mounting ZIPs as the Dashboards plugin directory does not install them.

          COPY plugins/ /plugins/
          RUN ls -lh /plugins/

          ENTRYPOINT ["sh", "-c", "echo 'XDR plugin container mounted at /plugins' && tail -f /dev/null"]
          EOF

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform plugin-only image
        uses: docker/build-push-action@v6
        with:
          context: sidecar-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/xdr-plugins:${{ needs.metadata.outputs.tag }}-osd-${{ matrix.osd_version }}
            ghcr.io/${{ github.repository_owner }}/xdr-plugins:latest-osd-${{ matrix.osd_version }}

      - name: Verify sidecar tags are published
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/xdr-plugins:${{ needs.metadata.outputs.tag }}-osd-${{ matrix.osd_version }}" >/dev/null
          docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/xdr-plugins:latest-osd-${{ matrix.osd_version }}" >/dev/null

  publish-release:
    name: Publish GitHub release
    if: github.event_name != 'pull_request'
    needs: [metadata, bundle-assets, docker-image, docker-plugin-sidecar]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release assets artifact
        uses: actions/download-artifact@v4
        with:
          pattern: bundle-assets-osd-*
          merge-multiple: true
          path: release-artifacts

      - name: Create and push release tag
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com

          if git rev-parse "${{ needs.metadata.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag already exists: ${{ needs.metadata.outputs.tag }}"
          else
            git tag "${{ needs.metadata.outputs.tag }}"
            git push origin "${{ needs.metadata.outputs.tag }}"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: XDR plugin bundle ${{ needs.metadata.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/xdr-plugins_*
            release-artifacts/docker-compose.xdr-plugins.*.yml
