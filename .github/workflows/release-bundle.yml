name: XDR Plugin Bundle Release

# Code changes validate/release the suite; README-only edits need no rebuild.
# Manual runs also pick up new commits from the other four plugin repositories.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xdr-release-${{ github.ref }}
  cancel-in-progress: false

env:
  OPENSEARCH_DASHBOARDS_REPOSITORY: opensearch-project/OpenSearch-Dashboards
  # Define supported targets once; both build matrices use this list.
  OSD_VERSIONS: '["3.7.0","3.8.0","3.9.0"]'

# Four stages, 8 jobs: metadata + 3 builds + 3 image checks + release.
# Each supported Dashboards version needs its own ZIPs and images. PRs test only;
# pushes to main and manual runs publish after all required checks pass.
jobs:
  # 1. Freeze component SHAs once so every version builds identical source.
  # XDR Agent releases are independent: Defense no longer consumes its catalog.
  metadata:
    name: Resolve plugin sources
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sources: ${{ steps.meta.outputs.sources }}
      versions: ${{ steps.meta.outputs.versions }}
    steps:
      - name: Choose bundle tag and pin external component commits
        id: meta
        env:
          # Required for private component repos; the default token covers public repos.
          GH_TOKEN: ${{ secrets.XDR_SOURCE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          # Keep release history unique; published image tags use only the OSD version.
          echo "tag=xdr-security-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "versions=${OSD_VERSIONS}" >> "$GITHUB_OUTPUT"
          SOURCES='{}'
          for plugin in xdr-coordinator xdr-defense xdr-visualizer xdr-navigator; do
            REPO="${GITHUB_REPOSITORY_OWNER}/${plugin}"
            BRANCH=$(gh api "repos/${REPO}" --jq .default_branch)
            SHA=$(gh api "repos/${REPO}/commits/${BRANCH}" --jq .sha)
            SOURCES=$(jq -c --arg plugin "$plugin" --arg sha "$SHA" '. + {($plugin): $sha}' <<< "$SOURCES")
          done
          echo "sources=${SOURCES}" >> "$GITHUB_OUTPUT"

  # 2. Bootstrap Dashboards once per version, then test/build all five plugins.
  # Sharing this checkout avoids repeating bootstrap for each plugin.
  build-bundle:
    name: Build and verify ZIPs (OSD ${{ matrix.osd_version }})
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        osd_version: ${{ fromJSON(needs.metadata.outputs.versions) }}
    steps:
      - name: Checkout this workflow's XDR Security commit
        uses: actions/checkout@v7
        with:
          path: sources/xdr-security
          ref: ${{ github.sha }}
      - name: Checkout pinned Coordinator
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xdr-coordinator
          ref: ${{ fromJSON(needs.metadata.outputs.sources)['xdr-coordinator'] }}
          token: ${{ secrets.XDR_SOURCE_TOKEN || github.token }}
          path: sources/xdr-coordinator
      - name: Checkout pinned Defense
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xdr-defense
          ref: ${{ fromJSON(needs.metadata.outputs.sources)['xdr-defense'] }}
          token: ${{ secrets.XDR_SOURCE_TOKEN || github.token }}
          path: sources/xdr-defense
      - name: Checkout pinned Visualizer
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xdr-visualizer
          ref: ${{ fromJSON(needs.metadata.outputs.sources)['xdr-visualizer'] }}
          token: ${{ secrets.XDR_SOURCE_TOKEN || github.token }}
          path: sources/xdr-visualizer
      - name: Checkout pinned Navigator
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xdr-navigator
          ref: ${{ fromJSON(needs.metadata.outputs.sources)['xdr-navigator'] }}
          token: ${{ secrets.XDR_SOURCE_TOKEN || github.token }}
          path: sources/xdr-navigator

      # Use exact upstream source and its Node version, not a relabeled newer build.
      - name: Checkout matching OpenSearch Dashboards
        uses: actions/checkout@v7
        with:
          repository: ${{ env.OPENSEARCH_DASHBOARDS_REPOSITORY }}
          ref: ${{ matrix.osd_version }}
          path: opensearch-dashboards
      - name: Setup Dashboards' required Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: opensearch-dashboards/.nvmrc
          package-manager-cache: false
      - name: Install Yarn
        run: npm install -g yarn@1.22.22
      - name: Cache downloaded Yarn packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-osd-${{ hashFiles('opensearch-dashboards/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-osd-
      - name: Bootstrap OpenSearch Dashboards
        working-directory: opensearch-dashboards
        # One retry accommodates transient upstream dependency downloads.
        run: yarn osd bootstrap --single-version=loose || yarn osd bootstrap --single-version=loose

      - name: Test, stage and build each plugin ZIP
        env:
          OSD_ROOT: ${{ github.workspace }}/opensearch-dashboards
          OSD_VERSION: ${{ matrix.osd_version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-artifacts/plugins release-artifacts/meta
          for plugin in xdr-security xdr-coordinator xdr-defense xdr-visualizer xdr-navigator; do
            echo "::group::Build ${plugin} for Dashboards ${OSD_VERSION}"
            SOURCE="${GITHUB_WORKSPACE}/sources/${plugin}"
            TESTS=("${SOURCE}"/scripts/test_*.cjs)
            if (( ${#TESTS[@]} )); then
              NODE_PATH="${OSD_ROOT}/node_modules" node --test "${TESTS[@]}"
            fi
            PACKAGE_VERSION=$(node -p 'require(process.argv[1]).version' "${SOURCE}/package.json")
            MANIFEST_VERSION=$(node -p 'require(process.argv[1]).version' "${SOURCE}/opensearch_dashboards.json")
            if [[ "$PACKAGE_VERSION" != "$MANIFEST_VERSION" ]]; then
              echo "Version mismatch in ${plugin}: package=${PACKAGE_VERSION}, manifest=${MANIFEST_VERSION}" >&2
              exit 1
            fi
            # Stage only into this disposable CI checkout, never the component repos.
            PLUGIN_DIR="${OSD_ROOT}/plugins/${plugin}"
            mkdir -p "$PLUGIN_DIR"
            rsync -a --delete --exclude='.git' --exclude='build' --exclude='target' \
              --exclude='node_modules' --exclude='.yarn' --exclude='.pnp.*' \
              "${SOURCE}/" "${PLUGIN_DIR}/"
            (cd "$PLUGIN_DIR" && node ../../scripts/plugin_helpers build --opensearch-dashboards-version="$OSD_VERSION")
            ZIPS=("${PLUGIN_DIR}"/build/*.zip)
            if (( ${#ZIPS[@]} != 1 )); then
              echo "Expected one built ZIP for ${plugin}, found ${#ZIPS[@]}" >&2
              exit 1
            fi
            cp "${ZIPS[0]}" "release-artifacts/plugins/${plugin}.zip"
            PLUGIN_ID=$(node -p 'require(process.argv[1]).id' "${SOURCE}/opensearch_dashboards.json")
            jq -n --arg repo "$plugin" --arg id "$PLUGIN_ID" --arg version "$PACKAGE_VERSION" \
              --arg osd "$OSD_VERSION" --arg source "$(git -C "$SOURCE" rev-parse HEAD)" \
              --arg dashboards "$(git -C "$OSD_ROOT" rev-parse HEAD)" \
              '{repo: $repo, pluginId: $id, version: $version, osdVersion: $osd, sourceCommit: $source, dashboardsCommit: $dashboards}' \
              > "release-artifacts/meta/${plugin}.json"
            echo '::endgroup::'
          done

      # Reject missing/corrupt ZIPs, wrong IDs/versions and missing compiled UI.
      - name: Verify the complete five-plugin bundle
        run: |
          python3 -m unittest discover -s sources/xdr-security/tests -v
          python3 sources/xdr-security/scripts/verify_bundle.py release-artifacts ${{ matrix.osd_version }}

      - name: Package ZIPs, source manifest, checksums and Compose override
        env:
          BUNDLE_TAG: ${{ needs.metadata.outputs.tag }}
          OSD_VERSION: ${{ matrix.osd_version }}
        run: |
          set -euo pipefail
          PREFIX="xdr-plugins_${BUNDLE_TAG}_osd-${OSD_VERSION}"
          jq -s --arg osd "$OSD_VERSION" --arg tag "$BUNDLE_TAG" \
            '{releaseTag: $tag, opensearchDashboardsVersion: $osd, plugins: .}' \
            release-artifacts/meta/*.json > "release-artifacts/${PREFIX}_manifest.json"
          (cd release-artifacts/plugins && sha256sum *.zip > "../${PREFIX}.sha256")
          tar -czf "release-artifacts/${PREFIX}.tar.gz" -C release-artifacts/plugins .
          cat > "release-artifacts/docker-compose.xdr-plugins.${BUNDLE_TAG}.osd-${OSD_VERSION}.yml" <<EOF
          services:
            opensearch-dashboards:
              image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/opensearch-dashboards-xdr-bundle:xdr-security-osd-${OSD_VERSION}
              ports:
                - "5601:5601"
              environment:
                OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
          EOF
      - name: Upload this version's verified bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundle-assets-osd-${{ matrix.osd_version }}
          path: release-artifacts/
          if-no-files-found: error
          # ZIPs/tarballs are already compressed; recompressing wastes CPU.
          compression-level: 0
          retention-days: 2

  # 3. Install ZIPs into the real Dashboards image and exercise authenticated APIs.
  # Publication is gated on this runtime test. Both existing GHCR image formats
  # remain available: ready-to-run Dashboards and ZIP transport for Compose users.
  images:
    name: Test and publish images (OSD ${{ matrix.osd_version }})
    needs: [metadata, build-bundle]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        osd_version: ${{ fromJSON(needs.metadata.outputs.versions) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout runtime test and image recipe
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Download verified ZIPs and release assets
        uses: actions/download-artifact@v8
        with:
          name: bundle-assets-osd-${{ matrix.osd_version }}
          path: bundle-input
      - name: Create the Dashboards image context
        run: |
          mkdir -p docker-context/plugins
          cp bundle-input/plugins/*.zip docker-context/plugins/
          cp deploy/Dockerfile docker-context/Dockerfile
      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64
      # Use one builder for testing and publication so AMD64 layers are reused.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build native AMD64 test image
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          platforms: linux/amd64
          load: true
          tags: xdr-bundle:test
          build-args: |
            OSD_VERSION=${{ matrix.osd_version }}
          cache-from: type=gha,scope=xdr-bundle-osd-${{ matrix.osd_version }}
      - name: Test startup, role enforcement, APIs and retention setup
        run: |
          sudo sysctl -w vm.max_map_count=262144
          bash scripts/smoke_bundle.sh xdr-bundle:test ${{ matrix.osd_version }}

      # PRs stop after validation. Releases build AMD64 and ARM64 images below;
      # ARM64 is built with QEMU, while the runtime test above covers native AMD64.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}
      - name: Publish ready-to-run Dashboards image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            OSD_VERSION=${{ matrix.osd_version }}
          # Separate scopes prevent one version's cache from overwriting another.
          cache-from: type=gha,scope=xdr-bundle-osd-${{ matrix.osd_version }}
          cache-to: type=gha,scope=xdr-bundle-osd-${{ matrix.osd_version }},mode=max,ignore-error=true
          tags: |
            ghcr.io/${{ github.repository_owner }}/opensearch-dashboards-xdr-bundle:xdr-security-osd-${{ matrix.osd_version }}
            ghcr.io/${{ github.repository_owner }}/opensearch-dashboards-xdr-bundle:latest-osd-${{ matrix.osd_version }}

      # Keep ZIP transport for the existing Compose installer; it is not a
      # Dashboards runtime image, and copying ZIPs alone does not install plugins.
      - name: Create ZIP transport image context
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p sidecar-context/plugins
          cp bundle-input/plugins/*.zip sidecar-context/plugins/
          cat > sidecar-context/Dockerfile <<'EOF'
          FROM alpine:3.22
          COPY plugins/ /plugins/
          ENTRYPOINT ["sh", "-c", "echo 'XDR plugin archives available at /plugins' && tail -f /dev/null"]
          EOF
      - name: Publish plugin ZIP transport image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: sidecar-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/xdr-plugins:xdr-security-osd-${{ matrix.osd_version }}
            ghcr.io/${{ github.repository_owner }}/xdr-plugins:latest-osd-${{ matrix.osd_version }}
      - name: Verify both published image manifests
        if: github.event_name != 'pull_request'
        env:
          OSD_VERSION: ${{ matrix.osd_version }}
        run: |
          set -euo pipefail
          for image in opensearch-dashboards-xdr-bundle xdr-plugins; do
            docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${image}:xdr-security-osd-${OSD_VERSION}" >/dev/null
            docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${image}:latest-osd-${OSD_VERSION}" >/dev/null
          done

  # 4. Only tag/publish the GitHub release once every supported version passed.
  # Attach tarballs, manifests, checksums and Compose overrides; raw ZIPs stay
  # inside the tarballs/artifacts to avoid collisions between versioned bundles.
  publish-release:
    name: Publish GitHub release
    if: github.event_name != 'pull_request'
    needs: [metadata, build-bundle, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the tested commit and release tags
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download release assets for all Dashboards versions
        uses: actions/download-artifact@v8
        with:
          pattern: bundle-assets-osd-*
          # Separate directories prevent raw plugins/meta from overwriting each other.
          path: release-artifacts
      - name: Create and push release tag
        env:
          BUNDLE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          if git rev-parse "refs/tags/${BUNDLE_TAG}" >/dev/null 2>&1; then
            echo "Tag already exists: ${BUNDLE_TAG}"
          else
            git tag "$BUNDLE_TAG"
            git push origin "$BUNDLE_TAG"
          fi
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: XDR plugin bundle ${{ needs.metadata.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/**/xdr-plugins_*
            release-artifacts/**/docker-compose.xdr-plugins.*.yml
